# Open the app signed in as Maya, whoever was signed in before (flows leave other users signed in).
appId: host.exp.Exponent
---
- runFlow: util-open-app.yaml
- runFlow:
    when:
      visible:
        id: "demo-maya"
    commands:
      - tapOn:
          id: "demo-maya"
- runFlow:
    when:
      notVisible:
        id: "demo-maya"
    commands:
      - tapOn:
          id: "dev-pill"
      - tapOn:
          id: "dev-as-maya"
      - extendedWaitUntil:
          visible:
            id: "dev-note"
          timeout: 15000
      - tapOn:
          id: "dev-close"
- extendedWaitUntil:
    visible:
      text: ".*Maya\\."
    timeout: 30000
